<div class="task-form">
  <h2>New Task</h2>
  
  <form (ngSubmit)="onSubmit()">
    <input 
      type="text" 
      [(ngModel)]="title" 
      placeholder="Enter task title..."
      required
      class="input-title">

    <textarea 
      [(ngModel)]="description" 
      placeholder="Description (optional)"
      rows="3"
      class="input-description"></textarea>

    <div class="form-row">
      <div class="form-group">
        <label>Priority</label>
        <select [(ngModel)]="priority" class="select-priority">
          <option value="low">Low</option>
          <option value="medium">Medium</option>
          <option value="high">High</option>
        </select>
      </div>

      <div class="form-group">
        <label>Due Date</label>
        <input 
          type="date" 
          [(ngModel)]="dueDate"
          class="input-date">
      </div>
    </div>

    <app-button 
      text="Add Task" 
      type="primary" 
      [fullWidth]="true">
    </app-button>
  </form>
</div>
