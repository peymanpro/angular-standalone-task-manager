<div class="task-form">
  <h2>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="form-icon">
      <circle cx="12" cy="12" r="10"/>
      <line x1="12" y1="8" x2="12" y2="16"/>
      <line x1="8" y1="12" x2="16" y2="12"/>
    </svg>
    New Task
  </h2>
  
  <form (ngSubmit)="onSubmit()">
    <input 
      type="text" 
      [(ngModel)]="title" 
      name="title"
      placeholder="Enter task title..."
      required
      class="input-title">

    <textarea 
      [(ngModel)]="description" 
      name="description"
      placeholder="Description (optional)"
      rows="3"
      class="input-description"></textarea>

    <div class="form-row">
      <div class="form-group">
        <label>Priority</label>
        <select [(ngModel)]="priority" name="priority" class="select-priority">
          <option value="low">Low</option>
          <option value="medium">Medium</option>
          <option value="high">High</option>
        </select>
      </div>

      <div class="form-group">
        <label>Due Date</label>
        <input 
          type="date" 
          [(ngModel)]="dueDate"
          name="dueDate"
          class="input-date">
      </div>
    </div>

    <app-button 
      text="Add Task" 
      type="primary" 
      [fullWidth]="true">
    </app-button>
  </form>
</div>
