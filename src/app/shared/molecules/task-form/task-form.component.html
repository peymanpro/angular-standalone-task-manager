<div class="task-form">
  <h2>تسک جدید</h2>
  
  <form (ngSubmit)="onSubmit()">
    <input 
      type="text" 
      [(ngModel)]="title" 
      placeholder="عنوان تسک را وارد کنید..."
      required
      class="input-title">

    <textarea 
      [(ngModel)]="description" 
      placeholder="توضیحات (اختیاری)"
      rows="3"
      class="input-description"></textarea>

    <div class="form-row">
      <div class="form-group">
        <label>اولویت</label>
        <select [(ngModel)]="priority" class="select-priority">
          <option value="low">کم</option>
          <option value="medium">متوسط</option>
          <option value="high">بالا</option>
        </select>
      </div>

      <div class="form-group">
        <label>تاریخ سررسید</label>
        <input 
          type="date" 
          [(ngModel)]="dueDate"
          class="input-date">
      </div>
    </div>

    <app-button 
      text="افزودن تسک" 
      type="primary" 
      [fullWidth]="true">
    </app-button>
  </form>
</div>
